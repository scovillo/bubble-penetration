apiVersion: v1
kind: ConfigMap
metadata:
  name: bubble-postgres-config
  namespace: bubble-test
  labels:
    app: bubble-postgres
data:
  POSTGRES_DB: bubble_penetration
  POSTGRES_USER: bubble_dev_admin
  POSTGRES_PASSWORD: bubble-test-db-pw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bubble-config
  namespace: bubble-test
  labels:
    app: bubble-backend
data:
  DB-URL: "postgresql://bubble_dev_admin:bubble-test-db-pw@bubble-postgres-service:5432/bubble_penetration"
  NODE_ENV: "development"
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: bubble-test-postgres-pv-volume
  namespace: bubble-test
  labels:
    type: local
    app: bubble-postgres
spec:
  storageClassName: local-storage
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  local:
    path: "/var/volumes/bubble-test-db-data"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - v220220535134189595
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: bubble-postgres-pv-claim
  namespace: bubble-test
  labels:
    app: bubble-postgres
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bubble-postgres-service
  namespace: bubble-test
  labels:
    app: bubble-postgres
spec:
  type: ClusterIP
  selector:
    app: bubble-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubble-postgres
  namespace: bubble-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bubble-postgres
  template:
    metadata:
      labels:
        app: bubble-postgres
    spec:
      containers:
        - name: bubble-postgres
          image: postgres:13-alpine
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: bubble-postgres-config
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-db
      volumes:
        - name: postgres-db
          persistentVolumeClaim:
            claimName: bubble-postgres-pv-claim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubble-backend
  namespace: bubble-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bubble-backend
  template:
    metadata:
      labels:
        app: bubble-backend
    spec:
      containers:
      - name: bubble-backend
        image: docker.spicysources.de/bubble-backend:1.0.0
        imagePullPolicy: "Always"
        ports:
        - containerPort: 8088
        envFrom:
          - configMapRef:
              name: bubble-config
---
apiVersion: v1
kind: Service
metadata:
  name: bubble-backend-service
  namespace: bubble-test
spec:
  selector:
    app: bubble-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8088
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bubble-ingress
  namespace: bubble-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx-class
  tls:
    - hosts:
        - bubble-dev.spicysources.de
      secretName: bubble-tls-secret
  rules:
    - host: bubble-dev.spicysources.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bubble-backend-service
                port:
                  number: 8080
