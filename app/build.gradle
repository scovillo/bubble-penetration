apply plugin: 'com.android.application'

android {
    namespace = 'org.codeberg.scovillo.bubble'
    compileSdk = 37
    defaultConfig {
        applicationId "org.codeberg.scovillo.bubble"
        targetSdk = 37
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile = file(
                    project.findProperty("KEYSTORE_FILE")
                            ?: System.getenv("KEYSTORE_FILE")
                            ?: "../release.keystore"
            )
            storePassword = (
                    project.findProperty("KEYSTORE_PASSWORD")
                            ?: System.getenv("KEYSTORE_PASSWORD")
            )
            keyAlias = (
                    project.findProperty("KEY_ALIAS")
                            ?: System.getenv("KEY_ALIAS")
            )
            keyPassword = (
                    project.findProperty("KEY_PASSWORD")
                            ?: System.getenv("KEY_PASSWORD")
                            ?: storePassword
            )
        }
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    // Keep the long-supported build for F-Droid while satisfying Google Play's
    // Android 5.0 (API 21) minimum requirement.  The differing minSdk is part
    // of each variant's manifest, so these are intentionally separate APKs.
    flavorDimensions += "distribution"
    productFlavors {
        fdroid {
            dimension "distribution"
            minSdk = 14
        }
        play {
            dimension "distribution"
            minSdk = 21
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

android {
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_version}"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
    implementation "org.jetbrains.kotlin:kotlin-test:2.2.10"
}

tasks.register("generateReadme") {
    group = "documentation"
    description = "Automatically generates a README.md with project details and Android configuration."

    doLast {
        def readmeFile = file("$projectDir/../README.md")
        def descFile = file("$projectDir/../fastlane/metadata/android/en-US/full_description.txt")

        def descText = descFile.exists()
                ? descFile.text
                : """Bubble Penetration is a fast-paced game for filling spare moments.
Collect the right colors, use combos to maximize your score, and become the champion on the global leaderboard!"""

        def appName = project.findProperty("appName") ?: project.name
        def android = project.extensions.findByName("android")

        def compileSdk = android?.compileSdkVersion ?: "Unknown"
        def minSdk = android?.defaultConfig?.minSdk ?: "Unknown"
        def targetSdk = android?.defaultConfig?.targetSdk ?: "Unknown"
        def appId = android?.defaultConfig?.applicationId ?: "Unknown"
        def versionCode = android?.defaultConfig?.versionCode ?: "Unknown"
        def versionName = android?.defaultConfig?.versionName ?: "Unknown"

        def dependencies = configurations
                .findByName("implementation")
                ?.allDependencies
                ?.findAll { it.group != null }
                ?.collect {
                    "  - ${it.group}:${it.name}:${it.version ?: "unspecified"}"
                }
                ?.join("\n") ?: "  - None"

        def content = """
# ${appName}

📦 **Version:** ${versionCode} (${versionName})  
⚙️ **Build Tool:** Gradle ${gradle.gradleVersion}

## 🤖 Android Configuration

- **Application ID:** ${appId}
- **Compile SDK:** ${compileSdk}
- **Min SDK:** ${minSdk}
- **Target SDK:** ${targetSdk}

## 📱 Description

${descText.trim()}

The game is built using free and open-source software libraries.

## 🎁 Support Bubble Penetration

Bubble Penetration is free, open source, and developed independently.

If you enjoy the game, you can support its continued development with a voluntary donation.

Donations help with:

- Server and infrastructure costs, including the global leaderboard
- Maintenance, bug fixes, and new features
- Continued development of this free and open-source game

Bubble Penetration will remain fully playable without any donation.

[![Donate using Liberapay](https://liberapay.com/assets/widgets/donate.svg)](https://liberapay.com/scovillo/donate)

[![Donate using PayPal](https://www.paypalobjects.com/webstatic/icon/pp50.png)](https://paypal.me/muemmelmaus)

[![Donate using GitHub Sponsors](https://img.shields.io/badge/GitHub%20Sponsors-❤️-pink?logo=github&style=flat-square)](https://github.com/sponsors/scovillo)

You can also support the project without donating:

- ⭐ Star the project on [Codeberg](https://codeberg.org/scovillo/bubble-penetration)
- Share Bubble Penetration with others
- Send feedback or report bugs
- Contribute code or translations

Thank you for every kind of support! ❤️

## 🛠️ Build Instructions

```bash
./gradlew assembleDebug
```
For a release build:
```bash
./gradlew assembleRelease
```

📚 Dependencies

${dependencies}

📄 License

Bubble Penetration is free and open-source software.

Copyright (C) 2026 Lukas Scheerer

Licensed under the GNU General Public License v3.0.

You should have received a copy of the GNU General Public License along with
this program. If not, see https://www.gnu.org/licenses/.
""".stripIndent().trim()

        readmeFile.text = content
    }
}
