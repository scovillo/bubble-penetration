name: Backend Image Release

on:
  workflow_dispatch:

concurrency:
  group: backend-release
  cancel-in-progress: false

env:
  REGISTRY: codeberg.org
  IMAGE_NAME: scovillo/bubble-penetration-backend

jobs:
  test-build-push:
    runs-on: codeberg-kubernetes-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Read backend version
        shell: bash
        run: |
          VERSION=$(node --input-type=module -e \
            "import pkg from './backend/package.json' with { type: 'json' }; process.stdout.write(pkg.version)")
          test -n "$VERSION"
          echo "BACKEND_VERSION=$VERSION" >> "$FORGEJO_ENV"
          echo "Releasing backend image version $VERSION"

      - name: Log in to Codeberg container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.codeberg-runner.svc:1234

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BACKEND_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
