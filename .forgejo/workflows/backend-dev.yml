name: Backend Dev CI/CD

on:
  push:
    branches:
      - master
    paths:
      - backend/**
      - .forgejo/workflows/backend-dev.yml
  workflow_dispatch:

concurrency:
  group: backend-dev
  cancel-in-progress: true

env:
  REGISTRY: codeberg.org
  IMAGE_NAME: scovillo/bubble-penetration-backend

jobs:
  test-build-deploy:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/node:22-bookworm-slim
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install container build tools
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends buildah ca-certificates
          rm -rf /var/lib/apt/lists/*
          printf '[storage]\ndriver="vfs"\nrunroot="/run/containers/storage"\ngraphroot="/var/lib/containers/storage"\n' \
            > /etc/containers/storage.conf

      - name: Set up Node.js
        uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build and push dev image
        shell: bash
        env:
          BUILDAH_ISOLATION: chroot
        run: |
          IMAGE_DEV="${REGISTRY}/${IMAGE_NAME}:dev"
          IMAGE_SHA="${REGISTRY}/${IMAGE_NAME}:dev-${{ forge.sha }}"

          printf '%s' "${{ secrets.REGISTRY_PASSWORD }}" | \
            buildah login \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin \
              "$REGISTRY"

          buildah build \
            --isolation chroot \
            --tag "$IMAGE_DEV" \
            --tag "$IMAGE_SHA" \
            backend
          buildah push "$IMAGE_DEV" "docker://$IMAGE_DEV"
          buildah push "$IMAGE_SHA" "docker://$IMAGE_SHA"

      - name: Set up kubectl
        uses: https://github.com/Azure/setup-kubectl@v4

      - name: Configure Kubernetes access
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$FORGEJO_ENV"

      - name: Deploy to dev
        shell: bash
        run: |
          kubectl apply -f backend/.kubernetes/dev.yml
          kubectl set image deployment/bubble-backend \
            bubble-backend="${REGISTRY}/${IMAGE_NAME}:dev-${{ forge.sha }}" \
            --namespace bubble-dev
          kubectl rollout status deployment/bubble-backend \
            --namespace bubble-dev \
            --timeout=180s
