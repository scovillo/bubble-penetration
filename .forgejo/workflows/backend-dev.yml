name: Backend Dev CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
    paths:
      - backend/**
      - .forgejo/workflows/backend-dev.yml
  workflow_dispatch:

concurrency:
  group: backend-dev
  cancel-in-progress: true

env:
  REGISTRY: codeberg.org
  IMAGE_NAME: scovillo/bubble-penetration-backend

jobs:
  test-build-deploy:
    runs-on: codeberg-kubernetes-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Codeberg container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkitd.codeberg-runner.svc:1234

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ forge.sha }}
