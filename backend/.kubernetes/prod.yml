apiVersion: v1
kind: ConfigMap
metadata:
  name: bubble-config
  namespace: $NAMESPACE
  labels:
    app: bubble-backend
data:
  LOG_LEVEL: 'INFO'
  NODE_ENV: 'production'
---
apiVersion: v1
kind: Service
metadata:
  name: bubble-database-service
  namespace: $NAMESPACE
  labels:
    app: bubble-database
spec:
  type: ClusterIP
  selector:
    app: bubble-database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bubble-database
  namespace: $NAMESPACE
spec:
  serviceName: bubble-database-service
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: bubble-database
  template:
    metadata:
      labels:
        app: bubble-database
    spec:
      containers:
        - name: bubble-database
          image: postgres:18-alpine
          imagePullPolicy: 'IfNotPresent'
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: database-auth
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: postgres-data
      volumes:
        - name: postgres-data
          hostPath:
            path: /data/volumes/bubble-prod/db
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bubble-backend
  namespace: $NAMESPACE
spec:
  replicas: 2
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bubble-backend
  template:
    metadata:
      labels:
        app: bubble-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bubble-backend
          image: codeberg.org/scovillo/bubble-penetration-backend:$IMAGE_TAG
          imagePullPolicy: 'IfNotPresent'
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: bubble-config
            - secretRef:
                name: database-auth
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reset-highscores
  namespace: $NAMESPACE
spec:
  schedule: '0 0 1 * *'
  timeZone: 'Etc/UTC'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: bubble-highscore-reset
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: reset-highscores
              image: codeberg.org/scovillo/bubble-penetration-backend:$IMAGE_TAG
              imagePullPolicy: 'IfNotPresent'
              command: ['npm', 'run', 'reset-highscores']
              envFrom:
                - configMapRef:
                    name: bubble-config
                - secretRef:
                    name: database-auth
---
apiVersion: v1
kind: Service
metadata:
  name: bubble-backend-service
  namespace: $NAMESPACE
spec:
  selector:
    app: bubble-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bubble-ingress
  namespace: $NAMESPACE
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - $HOST
      secretName: bubble-tls-secret
  rules:
    - host: $HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bubble-backend-service
                port:
                  number: 3000
