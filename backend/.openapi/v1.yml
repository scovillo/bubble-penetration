openapi: 3.0.3
info:
  title: Bubble Penetration API v1
  version: 1.1.0
  description: API v1 for username registration and highscores.
servers:
  - url: https://bubble.lukas-scheerer.de/api
    description: Production
  - url: https://dev.bubble.lukas-scheerer.de/api
    description: Development
paths:
  /v1/users:
    post:
      summary: Register username
      description: Creates a user with initial highscore 0 when the username does not yet exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUsernameRequest'
            examples:
              default:
                value:
                  username: Lukas
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUsernameSuccessResponse'
              examples:
                created:
                  value:
                    success: true
                    user:
                      username: Lukas
        '200':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyExists:
                  value:
                    success: false
                    message: username already exists
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUsername:
                  value:
                    success: false
                    message: username must not be empty
  /v1/highscores:
    get:
      summary: List highscores
      description: |
        Without query parameters, returns all highscores for compatibility with older clients.
        Supplying `username` or `startRank` enables pagination with up to 50 entries. When both
        are supplied, `username` determines the first rank. Scores are sorted by score descending
        and username ascending.
      parameters:
        - name: username
          in: query
          required: false
          description: Starts the page at this user's global rank. Unknown users start at rank 1.
          schema:
            type: string
            minLength: 1
            maxLength: 10
        - name: startRank
          in: query
          required: false
          description: One-based global rank at which the page starts.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Highscores loaded
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GetHighscoresResponse'
                  - $ref: '#/components/schemas/GetHighscorePageResponse'
              examples:
                legacy:
                  summary: Full response without query parameters
                  value:
                    highscores:
                      - username: Lukas
                        score: 4711
                        timestamp: 20.08.2026
                paginated:
                  summary: Page response when a query parameter is supplied
                  value:
                    highscores:
                      - rank: 131
                        username: Lukas
                        score: 4711
                        timestamp: 20.08.2026
                    startRank: 131
                    total: 240
                    hasPrevious: true
                    hasNext: true
    post:
      summary: Save highscore
      description: Creates or updates a highscore for a username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveHighscoreRequest'
            examples:
              default:
                value:
                  username: Lukas
                  highscore: 4711
      responses:
        '200':
          description: Existing user highscore processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveHighscoreResponse'
              examples:
                updatedOrUnchanged:
                  value:
                    success: true
                    isNewHighscore: true
                    highscore:
                      username: Lukas
                      score: 4711
                      timestamp: 20.08.2026
        '201':
          description: New user created with highscore
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveHighscoreResponse'
              examples:
                created:
                  value:
                    success: true
                    isNewHighscore: true
                    highscore:
                      username: Lukas
                      score: 4711
                      timestamp: 20.08.2026
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUsername:
                  value:
                    success: false
                    message: username must not be empty
components:
  schemas:
    CreateUsernameRequest:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 10
    SaveHighscoreRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - highscore
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 10
        highscore:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
    User:
      type: object
      additionalProperties: false
      required:
        - username
      properties:
        username:
          type: string
    Highscore:
      type: object
      additionalProperties: false
      required:
        - username
        - score
        - timestamp
      properties:
        username:
          type: string
        score:
          type: integer
          minimum: 0
        timestamp:
          type: string
          description: Localized date string in de-DE format.
          example: 20.08.2026
    RankedHighscore:
      type: object
      additionalProperties: false
      required:
        - rank
        - username
        - score
        - timestamp
      properties:
        rank:
          type: integer
          minimum: 1
        username:
          type: string
        score:
          type: integer
          minimum: 0
        timestamp:
          type: string
          description: Localized date string in de-DE format.
          example: 20.08.2026
    CreateUsernameSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - user
      properties:
        success:
          type: boolean
          enum: [true]
        user:
          $ref: '#/components/schemas/User'
    SaveHighscoreResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - isNewHighscore
        - highscore
      properties:
        success:
          type: boolean
          enum: [true]
        isNewHighscore:
          type: boolean
        highscore:
          $ref: '#/components/schemas/Highscore'
    GetHighscoresResponse:
      type: object
      additionalProperties: false
      required:
        - highscores
      properties:
        highscores:
          type: array
          items:
            $ref: '#/components/schemas/Highscore'
    GetHighscorePageResponse:
      type: object
      additionalProperties: false
      required:
        - highscores
        - startRank
        - total
        - hasPrevious
        - hasNext
      properties:
        highscores:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RankedHighscore'
        startRank:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        hasPrevious:
          type: boolean
        hasNext:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
